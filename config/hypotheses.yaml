# Toutes les hypothèses chiffrées du projet.
# Chaque valeur porte un commentaire : d'où elle vient, statut (HYPOTHESE / CONVENTION).
# À compléter par les tâches T2 (recalibrage) et T8 (business case).

seed: 2027

reseau_france:
  nb_magasins: 48          # CONVENTION : X choisi par l'équipe

# T2 (Alexis) : recalibrage de la rentabilité des magasins France simulés (audit v1, point 1).
# Cible : payback médian France entre 1 et 4 ans par format ; CA HT/m² d'un spécialiste chaussures.
# Repère public d'ordre de grandeur (donnée d'enseigne, pas moyenne sectorielle, À VÉRIFIER) :
# plaquette franchise Sport 2000, CA moyen 8 500 € TTC/m² (≈ 7 100 € HT) pour 40 à 80 m²,
# https://www.sport2000.fr/sp2k-assets/link/ouvrir-un-magasin/plaquette-s2.pdf (consultée le 12/11/2026).
# v1 : 9 000 à 19 000 € HT/m², payback 3 à 19 mois -> irréaliste.
simulation_reseau_france:
  facteur_volume_magasins: 2.33   # HYPOTHESE : v1 = 3,8 unités de base ; abaissé pour viser ~5 500 € HT/m² en centre commercial
  facteur_volume_web: 3.8         # CONVENTION : e-commerce inchangé par rapport à v1 (hors périmètre du payback)
  etp_minimum: 3                  # CONVENTION v1 : amplitude d'ouverture 6 j/7
  formats:                        # loyer hors charges ; productivité = multiplicateur du volume de base
    Centre-ville:
      surface_min_m2: 70          # v1
      surface_max_m2: 140         # v1
      loyer_m2_an_eur: 1100       # v1
      productivite_relative: 1.0  # HYPOTHESE : v1 = 1,15
      m2_par_etp: 22              # v1
    Centre commercial:
      surface_min_m2: 80
      surface_max_m2: 160
      loyer_m2_an_eur: 750
      productivite_relative: 1.0
      m2_par_etp: 22
    Outlet:
      surface_min_m2: 120
      surface_max_m2: 220
      loyer_m2_an_eur: 380
      productivite_relative: 0.95 # HYPOTHESE : v1 = 0,85
      m2_par_etp: 30              # HYPOTHESE : v1 = 22 ; libre-service, moins de conseil en outlet
    Gare / Aéroport:
      surface_min_m2: 40
      surface_max_m2: 80
      loyer_m2_an_eur: 1900
      productivite_relative: 1.05 # HYPOTHESE : v1 = 1,35 ; flux élevé mais petites surfaces
      m2_par_etp: 22
  capex_ouverture:                # aménagement × surface + part fixe (stock initial, pré-ouverture)
    amenagement_m2_min_eur: 1300  # v1
    amenagement_m2_max_eur: 1800  # v1
    part_fixe_eur: 45000          # v1
  fermetures:                     # biais de survie (référentiel, fiche 4.1)
    nb_magasins: 3                # CONVENTION : quelques fermetures pour l'illustrer
    vivier_moins_productifs: 10   # CONVENTION : tirées parmi les 10 magasins les moins productifs
    ouverts_au_plus_tard_en: 2021 # CONVENTION : au moins 2 ans d'historique avant la fermeture
    annees: [2023, 2024, 2025]    # CONVENTION : fermetures dans la période observée

# Zones insulaires : exclues du benchmark logistique (pas de liaison routière avec les hubs ;
# la distance « vol d'oiseau × 1,25 » n'y a pas de sens). FAIT géographique.
zones_insulaires: [Las Palmas, Palma]   # Grande Canarie ; Majorque

business_case_allemagne:   # T8 (Alexis) : compte de résultat d'un magasin type, vues business_case et city_scoring
  annee_premiere_ouverture: 2027
  nb_magasins_cible_2029: 6          # HYPOTHESE à valider : 2 ouvertures par an de 2027 à 2029 (les 6 premières villes du scoring)
  formats_retenus: [Centre commercial, Centre-ville]   # CONVENTION : formats les plus représentés du réseau France
  emplacement_immobilier:            # format du magasin -> type d'emplacement de fact_immobilier (loyer + charges)
    Centre commercial: Centre commercial
    Centre-ville: Centre-ville (secondaire)   # HYPOTHESE : emplacement n°1 bis, proche du loyer France hors Paris ; le prime (~2 500 €/m²/an) est hors de portée
  # Magasin type : surface, ETP, CA/m² et taux de marge = moyennes du réseau France au même format (CALCUL),
  # taux de marge corrigé de l'écart de marge post-taxe Allemagne - France (T7 : TVA, transport depuis le hub).
  scenarios:                         # montée en charge : part du CA de croisière en années 1, 2, 3 (100 % ensuite)
    pessimiste:
      ca_m2_vs_france_meme_format: 0.75   # HYPOTHESE : marque connue (14,0 % de part via revendeurs) mais réseau nouveau
      montee_en_charge: [0.60, 0.80, 0.90]   # HYPOTHESE : démarrage lent, croisière non atteinte en année 3
    central:
      ca_m2_vs_france_meme_format: 0.90   # HYPOTHESE
      montee_en_charge: [0.70, 0.90, 1.00]   # HYPOTHESE : croisière atteinte en année 3
    optimiste:
      ca_m2_vs_france_meme_format: 1.05   # HYPOTHESE : pouvoir d'achat et taille de marché supérieurs à la France
      montee_en_charge: [0.85, 1.00, 1.00]   # HYPOTHESE : notoriété existante, croisière dès l'année 2
  couts_additionnels_pct_ca:         # coûts variables, en % du CA HT
    demarque: 1.5           # HYPOTHESE : vol, casse, erreurs ; ordre de grandeur du commerce d'habillement-chaussures
    frais_bancaires: 0.6    # HYPOTHESE : commissions sur paiements par carte
    frais_siege: 4.0        # HYPOTHESE : quote-part des fonctions centrales (achats, marketing, IT, finance)
    logistique: 2.0         # HYPOTHESE : stockage, préparation, réassort ; le transport hub -> ville est déjà dans l'écart de marge (T7)
  investissement:            # aménagement (fact_couts_exploitation DE, €/m²) x surface + part fixe + marketing de lancement (DE)
    part_fixe_eur: 45000    # CONVENTION : même part fixe que le réseau France (stock initial, pré-ouverture), voir simulation_reseau_france
  duree_amortissement_capex_ans: 7   # CONVENTION : durée d'usage de l'agencement, alignée sur un bail commercial
  horizon_annees: 10        # CONVENTION : au-delà, l'investissement est réputé non remboursé

sensibilite_payback:        # T8-sensibilite : grille de lecture du payback, ne modifie aucun seuil
  scenario: pessimiste      # CONVENTION : le scénario jugé par la grille Go / No-Go (README 4.2)
  format: Centre commercial # CONVENTION : le format le mieux placé du business case
  etp_min: 3.0              # CONVENTION : minimum du réseau France (simulation_reseau_france.etp_minimum)
  etp_pas: 0.05             # CONVENTION : pas de la grille ; le maximum est l'ETP du magasin type (moyenne France)
  ca_m2_ratio_min: 0.75     # CONVENTION : CA/m² du scénario pessimiste, en part de la France
  ca_m2_ratio_max: 1.05     # CONVENTION : CA/m² du scénario optimiste
  ca_m2_ratio_pas: 0.01     # CONVENTION : pas de la grille

impact_origine:             # Levier : droit de douane UE selon le pays de fabrication (vue impact_origine)
  code_sh: "6402.99"        # CONVENTION : seul code SH du catalogue simulé vérifié dans TARIC (codes NC 6402 99 10 à 98)
  pays_preferentiel: Vietnam   # CONVENTION : valeur de dim_produit.pays_origine qui bénéficie de la préférence
  droit_preferentiel_pct: 0    # FAIT : TARIC, « Tariff preference » Viet Nam, 0 %, décision D0753/20, depuis le 01/08/2020, lu le 12/11/2026
  # Le droit de pays tiers (16,8 %) n'est pas répété ici : la vue le lit dans taxes_reference (T18).
  scenario: pessimiste      # CONVENTION : le scénario jugé par la grille Go / No-Go (README 4.2)
  format: Centre commercial # CONVENTION : le format le mieux placé du business case

decision:                   # Synthèse Go / No-Go, règle de combinaison du README (section 4.2), CONVENTION fixée le 12/11/2026
  verdict: NO-GO en l'état, GO conditionnel
  # En l'état (kpi_summary, Allemagne) : payback pessimiste non atteint en 10 ans dans les deux formats (NO-GO),
  # coût d'occupation du centre-ville à 16,9 % (NO-GO) ; les autres critères jugés sont GO.
  conditions:               # chaque valeur est lue dans la vue citée, 12/11/2026 (jeu simulé recalibré, prix et catalogue réels)
    format: Centre commercial          # seul format GO sur le coût d'occupation (14,9 %, business_case, scénario central)
    nb_etp: 3.0                        # sensibilite_payback : GO dès 1,02 x le CA/m² France à 3 ETP (payback 35,5 mois)
    nb_etp_max: 3.25                   # sensibilite_payback : au-delà, aucun GO dans la grille ; 3,25 ETP demande 1,05 x le CA/m² France
    ca_m2_min_vs_france: 1.02          # sensibilite_payback : CA/m² au moins égal à celui de la France au même format + 2 %, à 3 ETP
    villes: [Berlin, Dortmund, Hamburg, Köln, Hannover, Nürnberg]   # city_scoring : les 6 villes prioritaires (est_prioritaire)
    hub: Dordrecht                     # distance_hub (OSRM) : hub le plus proche des 6 villes prioritaires (11 villes sur 12)
  leviers_secondaires:
    preference_vietnam_gain_marge_pts: 1.6   # impact_origine : droit de douane UE à 0 % pour les produits fabriqués au Vietnam ;
                                             # +1,6 point de marge, payback pessimiste toujours non atteint : insuffisant seul

city_scoring:               # T8 : score des villes allemandes sur 100 ; chaque critère est ramené de 0 à 100 entre les 12 villes
  poids:                    # CONVENTION fixée avant le calcul, somme = 100
    potentiel: 40           # population de la zone de chalandise x indice de revenu (simulé)
    loyer: 25               # loyer + charges des formats retenus : moins cher = mieux
    densite_concurrentielle: 15   # magasins de chaussures pour 100 000 hab. (OSM, réel) : moins dense = mieux
    distance_hub: 20        # distance routière au hub le plus proche (OSRM, réel) : plus proche = mieux

nettoyage:                 # T5 : bronze -> silver
  iqr_multiplicateur: 1.5  # CONVENTION : méthode des quartiles (README 2.5, règle 10)

collecte:                  # T16, T17 : appels aux services ouverts
  pays_cible: DE           # CONVENTION : pays étudié (README, section 1)
  delai_entre_requetes_s: 2          # CONVENTION : règle 7 du projet, au moins 2 s entre requêtes
  overpass:                # politique d'usage lue le 12/11/2026 (documentation Overpass et wiki OSM)
    url: https://overpass-api.de/api/interpreter   # instance publique principale (FOSSGIS)
    attente_apres_refus_s: 30        # politique d'usage : pause de 30 s après une erreur 429 ou 406
    essais_max: 3                    # CONVENTION : au-delà, le script s'arrête
    delai_reponse_s: 60              # CONVENTION : durée maximale d'une requête
  destatis:                # population officielle des communes (Gemeindeverzeichnis)
    fichier: destatis_05-staedte_2024-12-31.xlsx   # FAIT : classeur tel que téléchargé, dans data/bronze/
    page_url: https://www.destatis.de/DE/Themen/Laender-Regionen/Regionales/Gemeindeverzeichnis/Administrativ/05-staedte.html
    date_consultation: "2026-11-12"  # FAIT : jour du téléchargement du classeur
    delai_entre_requetes_s: 30       # robots.txt de destatis.de (Crawl-delay: 30), lu le 12/11/2026
  nominatim:               # géocodage des communes des hubs ; politique d'usage lue le 12/11/2026
    url: https://nominatim.openstreetmap.org/search   # 1 requête par seconde au maximum, résultats mis en cache
  osrm:                    # distances routières ; politique d'usage lue le 12/11/2026 (FOSSGIS)
    url: https://router.project-osrm.org/route/v1/driving   # serveur public : 1 requête par seconde au maximum
    attente_apres_refus_s: 30        # CONVENTION : même pause que pour Overpass après une erreur du serveur
    essais_max: 3                    # CONVENTION : au-delà, le script s'arrête
    delai_reponse_s: 60              # CONVENTION : durée maximale d'une requête
  crocs:                   # T3 : prix des sites Crocs, robots.txt lu le 12/11/2026 (identique FR et DE)
    sites:
      FR: https://www.crocs.fr
      DE: https://www.crocs.de
    categories:            # CONVENTION : les trois pages « silhouette » des sites, sans filtre ni tri
      Sabots:              # (accessoires et Jibbitz exclus : le KPI porte sur les chaussures)
        FR: /c/silhouette/sabots
        DE: /c/silhouette/clogs
      Sandales:
        FR: /c/silhouette/sandales
        DE: /c/silhouette/sandalen
      Chaussures:
        FR: /c/silhouette/chaussures
        DE: /c/silhouette/schuhe
    nb_modeles_par_categorie: 5      # CONVENTION : modèles communs FR/DE relevés en page produit, par catégorie
    tva_pct:               # FAIT : taux normal, qui s'applique aussi aux chaussures enfant (README, section 2)
      FR: 20               # Code général des impôts, art. 278
      DE: 19               # Umsatzsteuergesetz, § 12 Abs. 1
    delai_reponse_s: 30              # CONVENTION : durée maximale d'une requête
  eurostat:                # T4 : API de diffusion Eurostat ; robots.txt de ec.europa.eu lu le 12/11/2026
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/   # /eurostat/api/ autorisé
    pays: [FR, DE, ES, IT, BE, NL, GB]   # CONVENTION : les pays de dim_pays
    annee_depuis: 2018               # CONVENTION : on garde la dernière année publiée depuis cette date
    delai_reponse_s: 60              # CONVENTION : durée maximale d'une requête

kpi:                   # T7 (Alexis) : périmètre temporel des vues sql/kpi/
  annee_reference: 2025  # CONVENTION : dernière année complète (2026 est partiel, README 2.5 règle 8)
  tcam_annee_debut: 2022 # CONVENTION : TCAM 2022-2025 du segment (README 2.3)
  tcam_annee_fin: 2025   # CONVENTION : idem ; les années projetées (est_projection) sont exclues

go_no_go:              # CONVENTION fixée avant analyse (README 4.2)
  tcam_segment_min_pct: 2.0
  indice_prix_min: 95
  indice_prix_max: 110
  ecart_marge_vs_france_max_pts: 5
  cout_occupation_max_pct_ca: 15
  payback_pessimiste_max_mois: 36
  catalogue_eligible_min_pct: 80

ia:                         # T9 (Briac) : commentaires du dashboard, src/ai/commentary.py
  modele: claude-haiku-5-5      # HYPOTHÈSE : identifiant relevé dans une source secondaire (iclarified.com, 08/10/2026), à confirmer dans la console Anthropic
  reflexion: disabled          # HYPOTHÈSE : la réflexion du modèle consomme le plafond max_tokens (doc du SDK, paramètre thinking) et a laissé 14 textes vides le 12/11/2026 ; si l'API refuse disabled, mettre adaptive et max_tokens à 4000
  max_tokens: 2000              # CONVENTION : plafond d'une réponse, large pour ne jamais couper la synthèse ; un texte coupé est rejeté
  delai_entre_appels_s: 0.5     # CONVENTION : marge entre deux appels ; le SDK rejoue de lui-même une erreur 429
  tentatives_max: 3             # nouveaux essais du SDK sur 408, 409, 429 et 5xx (anthropic/_base_client.py)
  synthese_mots_max: 300        # CONVENTION : la synthèse tient dans une zone de texte du dashboard ; une version sans limite a été coupée à 816 mots au plafond max_tokens le 12/11/2026
