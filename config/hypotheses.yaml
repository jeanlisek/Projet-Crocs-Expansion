# Toutes les hypothèses chiffrées du projet.
# Chaque valeur porte un commentaire : d'où elle vient, statut (HYPOTHESE / CONVENTION).
# À compléter par les tâches T2 (recalibrage) et T8 (business case).

seed: 2027

reseau_france:
  nb_magasins: 48          # CONVENTION : X choisi par l'équipe

# T2 (Alexis) : recalibrage de la rentabilité des magasins France simulés (audit v1, point 1).
# Cible : payback médian France entre 1 et 4 ans par format ; CA HT/m² d'un spécialiste chaussures.
# Repère public d'ordre de grandeur (donnée d'enseigne, pas moyenne sectorielle, À VÉRIFIER) :
# plaquette franchise Sport 2000, CA moyen 8 500 € TTC/m² (≈ 7 100 € HT) pour 40 à 80 m²,
# https://www.sport2000.fr/sp2k-assets/link/ouvrir-un-magasin/plaquette-s2.pdf (consultée le 12/11/2026).
# v1 : 9 000 à 19 000 € HT/m², payback 3 à 19 mois -> irréaliste.
simulation_reseau_france:
  facteur_volume_magasins: 2.33   # HYPOTHESE : v1 = 3,8 unités de base ; abaissé pour viser ~5 500 € HT/m² en centre commercial
  facteur_volume_web: 3.8         # CONVENTION : e-commerce inchangé par rapport à v1 (hors périmètre du payback)
  etp_minimum: 3                  # CONVENTION v1 : amplitude d'ouverture 6 j/7
  formats:                        # loyer hors charges ; productivité = multiplicateur du volume de base
    Centre-ville:
      surface_min_m2: 70          # v1
      surface_max_m2: 140         # v1
      loyer_m2_an_eur: 1100       # v1
      productivite_relative: 1.0  # HYPOTHESE : v1 = 1,15
      m2_par_etp: 22              # v1
    Centre commercial:
      surface_min_m2: 80
      surface_max_m2: 160
      loyer_m2_an_eur: 750
      productivite_relative: 1.0
      m2_par_etp: 22
    Outlet:
      surface_min_m2: 120
      surface_max_m2: 220
      loyer_m2_an_eur: 380
      productivite_relative: 0.95 # HYPOTHESE : v1 = 0,85
      m2_par_etp: 30              # HYPOTHESE : v1 = 22 ; libre-service, moins de conseil en outlet
    Gare / Aéroport:
      surface_min_m2: 40
      surface_max_m2: 80
      loyer_m2_an_eur: 1900
      productivite_relative: 1.05 # HYPOTHESE : v1 = 1,35 ; flux élevé mais petites surfaces
      m2_par_etp: 22
  capex_ouverture:                # aménagement × surface + part fixe (stock initial, pré-ouverture)
    amenagement_m2_min_eur: 1300  # v1
    amenagement_m2_max_eur: 1800  # v1
    part_fixe_eur: 45000          # v1
  fermetures:                     # biais de survie (référentiel, fiche 4.1)
    nb_magasins: 3                # CONVENTION : quelques fermetures pour l'illustrer
    vivier_moins_productifs: 10   # CONVENTION : tirées parmi les 10 magasins les moins productifs
    ouverts_au_plus_tard_en: 2021 # CONVENTION : au moins 2 ans d'historique avant la fermeture
    annees: [2023, 2024, 2025]    # CONVENTION : fermetures dans la période observée

# Zones insulaires : exclues du benchmark logistique (pas de liaison routière avec les hubs ;
# la distance « vol d'oiseau × 1,25 » n'y a pas de sens). FAIT géographique.
zones_insulaires: [Las Palmas, Palma]   # Grande Canarie ; Majorque

business_case_allemagne:
  annee_premiere_ouverture: 2027
  nb_magasins_cible_2029: null       # TODO T8
  formats_retenus: [Centre commercial, Centre-ville]   # TODO T8 : à confirmer par le scoring
  scenarios:
    pessimiste:
      ca_m2_vs_france_meme_format: null   # TODO T8 (ex. ratio appliqué au CA/m² France)
    central:
      ca_m2_vs_france_meme_format: null
    optimiste:
      ca_m2_vs_france_meme_format: null
  couts_additionnels_pct_ca:
    demarque: null          # TODO T8, HYPOTHESE
    frais_bancaires: null   # TODO T8, HYPOTHESE
    frais_siege: null       # TODO T8, HYPOTHESE
  duree_amortissement_capex_ans: null   # TODO T8, CONVENTION

nettoyage:                 # T5 : bronze -> silver
  iqr_multiplicateur: 1.5  # CONVENTION : méthode des quartiles (README 2.5, règle 10)

collecte:                  # T16, T17 : appels aux services ouverts
  pays_cible: DE           # CONVENTION : pays étudié (README, section 1)
  delai_entre_requetes_s: 2          # CONVENTION : règle 7 du projet, au moins 2 s entre requêtes
  overpass:                # politique d'usage lue le 12/11/2026 (documentation Overpass et wiki OSM)
    url: https://overpass-api.de/api/interpreter   # instance publique principale (FOSSGIS)
    attente_apres_refus_s: 30        # politique d'usage : pause de 30 s après une erreur 429 ou 406
    essais_max: 3                    # CONVENTION : au-delà, le script s'arrête
    delai_reponse_s: 60              # CONVENTION : durée maximale d'une requête
  destatis:                # population officielle des communes (Gemeindeverzeichnis)
    fichier: destatis_05-staedte_2024-12-31.xlsx   # FAIT : classeur tel que téléchargé, dans data/bronze/
    page_url: https://www.destatis.de/DE/Themen/Laender-Regionen/Regionales/Gemeindeverzeichnis/Administrativ/05-staedte.html
    date_consultation: "2026-11-12"  # FAIT : jour du téléchargement du classeur
    delai_entre_requetes_s: 30       # robots.txt de destatis.de (Crawl-delay: 30), lu le 12/11/2026
  nominatim:               # géocodage des communes des hubs ; politique d'usage lue le 12/11/2026
    url: https://nominatim.openstreetmap.org/search   # 1 requête par seconde au maximum, résultats mis en cache
  osrm:                    # distances routières ; politique d'usage lue le 12/11/2026 (FOSSGIS)
    url: https://router.project-osrm.org/route/v1/driving   # serveur public : 1 requête par seconde au maximum
    attente_apres_refus_s: 30        # CONVENTION : même pause que pour Overpass après une erreur du serveur
    essais_max: 3                    # CONVENTION : au-delà, le script s'arrête
    delai_reponse_s: 60              # CONVENTION : durée maximale d'une requête
  crocs:                   # T3 : prix des sites Crocs, robots.txt lu le 12/11/2026 (identique FR et DE)
    sites:                 # CONVENTION : une liste de départ par site, la catégorie sabots sans filtre
      FR:
        url: https://www.crocs.fr
        categorie_depart: /c/silhouette/sabots
      DE:
        url: https://www.crocs.de
        categorie_depart: /c/silhouette/clogs
    nb_modeles_par_site: 10          # CONVENTION : échantillon de l'étape 2 de T3, à élargir ensuite
    delai_reponse_s: 30              # CONVENTION : durée maximale d'une requête

go_no_go:              # CONVENTION fixée avant analyse (README 4.2)
  tcam_segment_min_pct: 2.0
  indice_prix_min: 95
  indice_prix_max: 110
  ecart_marge_vs_france_max_pts: 5
  cout_occupation_max_pct_ca: 15
  payback_pessimiste_max_mois: 36
  catalogue_eligible_min_pct: 80
