name: CI qualité et tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  qualite-et-tests:
    # Les tests tournent sur les deux systèmes de l'équipe ; fail-fast désactivé pour voir
    # le résultat de chacun même si l'autre échoue.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install black flake8 pytest

      # Format et lint ne dépendent pas du système : une seule fois, sous Linux.
      - name: Vérifier le format (black)
        if: matrix.os == 'ubuntu-latest'
        run: black --check src tests

      - name: Vérifier le lint (flake8)
        if: matrix.os == 'ubuntu-latest'
        run: flake8 src tests --max-line-length 100

      - name: Lancer les tests (pytest)
        run: pytest -q
